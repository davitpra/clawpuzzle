# Producción en un solo servidor (AWS Lightsail): API + Postgres + Redis + Caddy.
#
#   cd deploy
#   cp .env.example .env && cp .env.backend.example .env.backend   # y rellenar
#   docker compose up -d --build
#
# Solo Caddy publica puertos. Postgres, Redis y la API quedan en la red interna
# de Compose y no son accesibles desde fuera del servidor.

name: clawpuzzle

x-logging: &logging
  # Sin límite, los logs de Docker acaban llenando el disco del servidor.
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clawpuzzle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-clawpuzzle}
    # A partir de la imagen 18 los datos viven en /var/lib/postgresql/18/docker,
    # así que el volumen se monta en el directorio padre.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: BullMQ pierde jobs si Redis borra claves al llenarse la memoria.
    # appendonly: los jobs pendientes sobreviven a un reinicio.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?falta REDIS_PASSWORD en deploy/.env}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # Aplica las migraciones pendientes y termina; la API no arranca hasta que
  # acabe bien (equivale al preDeployCommand de Railway).
  migrate:
    build:
      context: ../backend
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clawpuzzle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clawpuzzle}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  backend:
    build:
      context: ../backend
      target: runtime
    image: clawpuzzle-backend
    restart: unless-stopped
    env_file: .env.backend
    # Las URLs de Postgres y Redis se construyen aquí para que apunten a los
    # contenedores; lo que diga .env.backend sobre ellas se ignora.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clawpuzzle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clawpuzzle}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: '3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    environment:
      API_DOMAIN: ${API_DOMAIN:?falta API_DOMAIN en deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados de Let's Encrypt: si se pierden, Caddy los vuelve a pedir
      # y Let's Encrypt limita cuántas veces por semana.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
